<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Página web desde USD 200</title>
  <desc id="desc">Historia para redes sociales de CRK Publicity sobre presencia web y visibilidad en asistentes de inteligencia artificial.</desc>
  <defs>
    <linearGradient id="overlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050505" stop-opacity=".98"/>
      <stop offset=".47" stop-color="#050505" stop-opacity=".72"/>
      <stop offset="1" stop-color="#050505" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop stop-color="#ff4d00"/><stop offset="1" stop-color="#ff9000"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ff5a00" stop-opacity=".28"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/><feFlood flood-color="#ff5a00" flood-opacity=".65" result="c"/><feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#050505"/>
  <image xlink:href="ai-discovery-background.png" x="-590" y="350" width="1920" height="1920" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1920" fill="url(#overlay)"/>
  <circle cx="858" cy="955" r="500" fill="url(#halo)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <image xlink:href="../../crk-publicity-logo.svg" x="76" y="92" width="190" height="97" filter="url(#glow)"/>
    <text x="76" y="249" fill="#ff7a20" font-size="22" font-weight="900" letter-spacing="2.7">DISEÑO WEB + SEO PARA IA</text>

    <text x="76" y="384" fill="#ffffff" font-size="82" font-weight="900" letter-spacing="-3.4">TU NEGOCIO</text>
    <text x="76" y="477" fill="#ffffff" font-size="82" font-weight="900" letter-spacing="-3.4">MERECE SER</text>
    <text x="76" y="570" fill="#ffffff" font-size="82" font-weight="900" letter-spacing="-3.4">ENCONTRADO.</text>

    <text x="76" y="707" fill="#d6d6da" font-size="38" font-weight="700">Haz que tu negocio aparezca</text>
    <text x="76" y="758" fill="#d6d6da" font-size="38" font-weight="700">en ChatGPT.</text>

    <rect x="76" y="831" width="396" height="58" rx="29" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="110" y="870" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1.5">PÁGINA WEB DESDE</text>
    <text x="76" y="1033" fill="url(#orange)" font-size="164" font-weight="900" letter-spacing="-8">USD 200</text>

    <g transform="translate(76 1110)" font-size="25" font-weight="800">
      <circle cx="16" cy="11" r="9" fill="#ff6700"/><text x="43" y="21" fill="#f3f3f5">Diseño adaptable a celular</text>
      <circle cx="16" cy="79" r="9" fill="#ff6700"/><text x="43" y="89" fill="#f3f3f5">Contenido preparado para búsqueda</text>
      <circle cx="16" cy="147" r="9" fill="#ff6700"/><text x="43" y="157" fill="#f3f3f5">WhatsApp y formulario de clientes</text>
    </g>

    <rect x="76" y="1390" width="470" height="100" rx="50" fill="url(#orange)"/>
    <text x="128" y="1453" fill="#090909" font-size="32" font-weight="900" letter-spacing="1">QUIERO MI WEB  →</text>

    <text x="76" y="1585" fill="#ffffff" font-size="25" font-weight="800">WHATSAPP</text>
    <text x="76" y="1634" fill="#ff7a20" font-size="44" font-weight="900">302 840 2389</text>
    <text x="76" y="1683" fill="#b6b6bb" font-size="24" font-weight="700">@crkpublicity</text>

    <line x1="76" x2="1004" y1="1760" y2="1760" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="76" y="1810" fill="#85858b" font-size="16">La visibilidad depende de la indexación, el contenido</text>
    <text x="76" y="1836" fill="#85858b" font-size="16">y las fuentes disponibles. No se garantizan menciones.</text>
  </g>
</svg>
