<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Página web desde USD 200</title>
  <desc id="desc">Promoción de CRK Publicity para crear una página web preparada para buscadores y asistentes de inteligencia artificial.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity=".99"/>
      <stop offset=".56" stop-color="#050505" stop-opacity=".88"/>
      <stop offset="1" stop-color="#050505" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="price" x1="0" x2="1">
      <stop stop-color="#ff4d00"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#ff4d00" flood-opacity=".55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#050505"/>
  <image xlink:href="ai-discovery-background.png" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1080" fill="url(#shade)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <image xlink:href="../../crk-publicity-logo.svg" x="64" y="58" width="150" height="76" filter="url(#logoGlow)"/>
    <text x="238" y="93" fill="#f7f7f7" font-size="20" font-weight="800" letter-spacing="2.6">DISEÑO · WEB · VISIBILIDAD</text>
    <text x="238" y="121" fill="#a8a8ad" font-size="17" font-weight="600">CRK Publicity</text>

    <rect x="64" y="177" width="298" height="44" rx="22" fill="#ff5a00" fill-opacity=".14" stroke="#ff6300" stroke-opacity=".65"/>
    <text x="86" y="206" fill="#ff7a20" font-size="17" font-weight="800" letter-spacing="1.6">WEB + SEO PARA IA</text>

    <text x="64" y="305" fill="#ffffff" font-size="74" font-weight="900" letter-spacing="-3">PÁGINA WEB</text>
    <text x="64" y="378" fill="#ffffff" font-size="74" font-weight="900" letter-spacing="-3">DESDE</text>
    <text x="64" y="507" fill="url(#price)" font-size="142" font-weight="900" letter-spacing="-7">USD 200</text>

    <text x="64" y="596" fill="#ffffff" font-size="41" font-weight="900" letter-spacing="-1.2">HAZ QUE TU NEGOCIO</text>
    <text x="64" y="646" fill="#ffffff" font-size="41" font-weight="900" letter-spacing="-1.2">APAREZCA EN CHATGPT</text>
    <rect x="64" y="674" width="520" height="4" rx="2" fill="#ff5a00"/>

    <g font-size="21" font-weight="700">
      <rect x="64" y="725" width="208" height="48" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="88" y="756" fill="#f1f1f3">Web rápida</text>
      <rect x="285" y="725" width="212" height="48" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="309" y="756" fill="#f1f1f3">SEO técnico</text>
      <rect x="510" y="725" width="255" height="48" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="534" y="756" fill="#f1f1f3">Lista para vender</text>
    </g>

    <rect x="64" y="824" width="286" height="78" rx="39" fill="url(#price)"/>
    <text x="107" y="874" fill="#0b0b0b" font-size="25" font-weight="900" letter-spacing=".8">COTIZA HOY  →</text>
    <text x="380" y="854" fill="#ffffff" font-size="22" font-weight="800">WhatsApp</text>
    <text x="380" y="884" fill="#ff7a20" font-size="28" font-weight="900">302 840 2389</text>

    <text x="64" y="974" fill="#b7b7bb" font-size="17" font-weight="600">@crkpublicity</text>
    <text x="64" y="1012" fill="#77777d" font-size="13">La visibilidad depende de la indexación, el contenido y las fuentes disponibles.</text>
  </g>
</svg>
