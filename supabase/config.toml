project_id = "crk-publicity"

[functions.public-lead]
verify_jwt = false

[functions.track-event]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.send-whatsapp]
verify_jwt = false
[auth]
site_url = "https://iwandezu.github.io/crkpublicity/admin/"
additional_redirect_urls = ["https://iwandezu.github.io/crkpublicity/admin/", "http://localhost:5173/crkpublicity/admin/"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true